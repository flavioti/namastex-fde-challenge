<script>
const NS = "http://www.w3.org/2000/svg";
const C = {
  line: "#4b5260", text: "#f3f4f6", muted: "#9aa1ad", blue: "#7aa7ff",
  cyan: "#3cc8f0", violet: "#b197fc", green: "#4ade80"
};

/* ---------- Dados ----------
   Vêm do bloco <script id="dados">, preenchido a partir de system-design/autoseguro-system-design.json.
   tipos de nó: phone | dot | lb | app | ext | db | worker | bucket | source
   future: true = ainda não existe / depende de confirmação (traço tracejado)
   pts das conexões: na ordem do fluxo; os pacotes andam do primeiro ponto ao último
   decorative: true = linha sem fluxo próprio; acende só nas cenas de visão geral ("nodes": "*") */
const DADOS = JSON.parse(document.getElementById("dados").textContent);
const NODES = DADOS.nodes, EDGES = DADOS.edges;
const ALL = Object.keys(NODES);
const SCENES = DADOS.scenes.map(s => ({ ...s, nodes: s.nodes === "*" ? ALL : s.nodes }));
document.getElementById("selo").textContent = DADOS.meta.selo;

/* ---------- Desenho ---------- */
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function label(g, x, y, txt, size, fill, extra = {}) {
  const lines = txt.split("\n");
  const t = el("text", { x, y: y - (lines.length - 1) * size * 0.5, "text-anchor": "middle",
    "dominant-baseline": "middle", "font-size": size, fill, ...extra }, g);
  lines.forEach((ln, i) => el("tspan", { x, dy: i ? size * 1.05 : 0 }, t).textContent = ln);
  return t;
}
const dash = n => n.future ? { "stroke-dasharray": "7 6" } : {};

const DRAW = {
  dot(g, n) { el("circle", { cx: n.x, cy: n.y, r: 6, fill: "#e5e7eb" }, g); },

  phone(g, n) {
    el("rect", { x: n.x - 17, y: n.y - 27, width: 34, height: 54, rx: 7, fill: "#2a2f39",
      stroke: "#8b93a1", "stroke-width": 2.2, ...dash(n) }, g);
    el("rect", { x: n.x - 11, y: n.y - 19, width: 22, height: 33, rx: 2, fill: "#1b1e24" }, g);
    el("line", { x1: n.x - 5, y1: n.y + 20, x2: n.x + 5, y2: n.y + 20, stroke: "#8b93a1",
      "stroke-width": 2.2, "stroke-linecap": "round" }, g);
    label(g, n.x + 34, n.y, n.label, 17, C.muted, { "text-anchor": "start" });
  },

  lb(g, n) {
    const w = n.w || 190, h = n.h || 40;
    el("rect", { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 9,
      fill: "#2b303a", stroke: "#6b7280", "stroke-width": 1.6 }, g);
    label(g, n.x, n.y + 1, n.label, 22, C.text);
  },

  app(g, n) {
    el("rect", { x: n.x - 60, y: n.y - 32, width: 120, height: 64, rx: 9, fill: "#10303b",
      stroke: C.cyan, "stroke-width": 2.2 }, g);
    el("rect", { x: n.x - 15, y: n.y - 24, width: 30, height: 22, rx: 4, fill: "none",
      stroke: C.cyan, "stroke-width": 2 }, g);
    label(g, n.x, n.y - 12, "</>", 13, C.cyan, { "font-family": "monospace", "font-weight": "bold" });
    label(g, n.x, n.y + 16, n.label, 21, C.cyan);
  },

  ext(g, n) {
    const w = n.w || 96, h = n.h || 64;
    el("rect", { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 9,
      fill: "#1f2229", stroke: "#8b93a1", "stroke-width": 2, ...dash(n) }, g);
    label(g, n.x, n.y - 8, "✦ " + n.label, 22, C.text);
    if (n.sub) label(g, n.x, n.y + 16, n.sub, 15, C.muted);
  },

  db(g, n) {
    const w = 110, h = 80, rx = w / 2, ry = 11, top = n.y - h / 2, bot = n.y + h / 2;
    const L = n.x - rx, R = n.x + rx;
    el("path", { d: `M${L},${top} L${L},${bot} A${rx},${ry} 0 0 0 ${R},${bot} L${R},${top}`,
      fill: "url(#dbBody)", stroke: "#9cbcff", "stroke-width": 2.6, ...dash(n) }, g);
    el("ellipse", { cx: n.x, cy: top, rx, ry, fill: "#5287ec", stroke: "#9cbcff", "stroke-width": 2.6, ...dash(n) }, g);
    el("path", { d: `M${L},${top + 25} A${rx},${ry} 0 0 0 ${R},${top + 25}`, fill: "none",
      stroke: "#9cbcff", "stroke-width": 2.2 }, g);
    label(g, n.x, n.y + 21, n.label, n.label.length > 9 ? 17 : 20, "#ffffff");
  },

  worker(g, n) {
    const w = n.w || 130, h = 56;
    el("rect", { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 9, fill: "#241d3a",
      stroke: C.violet, "stroke-width": 2.2, ...dash(n) }, g);
    label(g, n.x, n.y - 10, "⚙", 17, C.violet);
    label(g, n.x, n.y + 12, n.label, 20, C.violet);
  },

  bucket(g, n) {
    const t = n.y - 30, b = n.y + 32;
    el("path", { d: `M${n.x - 60},${t} L${n.x + 60},${t} L${n.x + 50},${b} L${n.x - 50},${b} Z`,
      fill: "#1a2340", stroke: C.blue, "stroke-width": 2.2, "stroke-linejoin": "round", ...dash(n) }, g);
    el("line", { x1: n.x - 59, y1: t + 11, x2: n.x + 59, y2: t + 11, stroke: C.blue, "stroke-width": 1.6 }, g);
    label(g, n.x, n.y + 4, n.label, 18, C.blue);
    if (n.sub) label(g, n.x, n.y + 22, n.sub, 12, C.muted, { "font-family": "monospace" });
  },

  source(g, n) {
    const w = 150, h = 50;
    el("rect", { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 9, fill: "#1f2229",
      stroke: n.future ? "#8b93a1" : "#e5e7eb", "stroke-width": 2, ...dash(n) }, g);
    // pequeno prédio público
    const ix = n.x - w / 2 + 16, iy = n.y;
    el("path", { d: `M${ix - 8},${iy - 4} L${ix},${iy - 11} L${ix + 8},${iy - 4} Z
      M${ix - 5},${iy - 3} v10 M${ix},${iy - 3} v10 M${ix + 5},${iy - 3} v10 M${ix - 9},${iy + 8} h18`,
      fill: "none", stroke: C.muted, "stroke-width": 1.5, "stroke-linejoin": "round" }, g);
    label(g, n.x + 10, n.y + 1, n.label, n.label.includes("\n") ? 15 : 18, C.text);
    if (n.tag) label(g, n.x, n.y + 40, n.tag, 15, C[n.tagColor] || C.muted);
  },
};

/* legenda no canto superior esquerdo */
(function legend() {
  const g = document.getElementById("legend");
  const items = [
    ["app", C.cyan, "#10303b", ""], ["banco", "#9cbcff", "#3f73dc", ""],
    ["processo", C.violet, "#241d3a", ""], ["futuro / a confirmar", "#8b93a1", "#1f2229", "6 5"],
  ];
  items.forEach(([txt, stroke, fill, da], i) => {
    const y = 130 + i * 34;
    el("rect", { x: 50, y: y - 11, width: 30, height: 22, rx: 5, fill, stroke, "stroke-width": 2,
      ...(da ? { "stroke-dasharray": da } : {}) }, g);
    label(g, 92, y + 1, txt, 18, C.muted, { "text-anchor": "start" });
  });
})();

const nodeEls = {}, edgeEls = {};
const gEdges = document.getElementById("edges");
const gNodes = document.getElementById("nodes");
const gPackets = document.getElementById("packets");
const pathD = pts => "M" + pts.map(p => p.join(",")).join(" L");

for (const [id, e] of Object.entries(EDGES)) {
  if (e.hidden) continue;
  edgeEls[id] = el("path", { class: "edge", d: pathD(e.pts), fill: "none", stroke: C.line,
    "stroke-width": 2, "stroke-linejoin": "round", ...(e.future ? { "stroke-dasharray": "6 6" } : {}) }, gEdges);
}
for (const [id, n] of Object.entries(NODES)) {
  /* nó com "link" abre a subpágina correspondente; o clique não avança a cena */
  let host = gNodes;
  if (n.link) {
    host = el("a", { href: n.link }, gNodes);
    host.addEventListener("click", ev => ev.stopPropagation());
  }
  const g = el("g", { class: "node" }, host);
  if (n.link) g.style.cursor = "pointer";
  DRAW[n.type](g, n);
  nodeEls[id] = g;
}

/* link de volta, quando a página é uma subpágina */
if (DADOS.meta.voltar) {
  const a = el("a", { href: DADOS.meta.voltar.href }, document.getElementById("stage"));
  a.addEventListener("click", ev => ev.stopPropagation());
  const t = el("text", { x: 30, y: 888, "font-size": 16, fill: C.cyan }, a);
  t.textContent = "← " + DADOS.meta.voltar.rotulo;
}

/* uma conexão acende quando os nós das duas pontas estão na cena */
function edgeVisible(id, on) {
  if (EDGES[id].decorative) return on.size === ALL.length;
  const pts = EDGES[id].pts, near = (n, p) => Math.abs(n.x - p[0]) <= 80 && Math.abs(n.y - p[1]) <= 56;
  const ends = [pts[0], pts[pts.length - 1]];
  return ends.every(p => Object.entries(NODES).some(([k, n]) => on.has(k) && near(n, p)));
}

/* ---------- Cena atual ---------- */
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const caption = document.getElementById("caption");
const capText = document.getElementById("capText");
const capBox = document.getElementById("capBox");
const dots = document.getElementById("dots");
let cur = 0, playing = true, timer = null;
const DURATION = 4200;

SCENES.forEach((_, i) => {
  const d = document.createElement("span");
  d.onclick = ev => { ev.stopPropagation(); go(i); };
  dots.appendChild(d);
});

function setRich(t, [a, b], accent) {
  t.textContent = "";
  el("tspan", { fill: C.text }, t).textContent = a;
  el("tspan", { fill: accent }, t).textContent = b;
}

function packets(ids) {
  gPackets.textContent = "";
  ids.forEach((id, k) => {
    const e = EDGES[id];
    if (e.decorative) return;
    const d = pathD(e.pts);
    const len = e.pts.slice(1).reduce((s, p, i) =>
      s + Math.hypot(p[0] - e.pts[i][0], p[1] - e.pts[i][1]), 0);
    const dur = Math.max(0.9, len / 170);
    for (let j = 0; j < 2; j++) {
      const begin = (j * dur / 2 + k * 0.12) + "s";
      const c = el("circle", { r: 5, fill: e.future ? C.muted : C.blue, opacity: 0 }, gPackets);
      el("animateMotion", { dur: dur + "s", begin, repeatCount: "indefinite", path: d }, c);
      el("animate", { attributeName: "opacity", values: "0;1;1;0", keyTimes: "0;0.1;0.85;1",
        dur: dur + "s", begin, repeatCount: "indefinite" }, c);
    }
  });
  document.getElementById("stage").setCurrentTime?.(0);
}

function go(i) {
  cur = (i + SCENES.length) % SCENES.length;
  const s = SCENES[cur], on = new Set(s.nodes);
  for (const t of [title, subtitle, caption]) t.style.opacity = 0;
  setTimeout(() => {
    setRich(title, s.title, C.blue);
    setRich(subtitle, s.sub, C.cyan);
    capText.textContent = s.cap;
    const w = Math.max(260, capText.getComputedTextLength() + 64);
    capBox.setAttribute("x", 800 - w / 2); capBox.setAttribute("width", w);
    for (const t of [title, subtitle, caption]) t.style.opacity = 1;
  }, 180);
  for (const [id, g] of Object.entries(nodeEls)) g.classList.toggle("dim", !on.has(id));
  for (const [id, p] of Object.entries(edgeEls)) p.classList.toggle("dim", !edgeVisible(id, on));
  packets(s.packets);
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === cur));
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (playing) timer = setTimeout(() => go(cur + 1), DURATION);
}
function toggle() {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "❚❚" : "▶︎";
  schedule();
}

document.getElementById("stage").onclick = () => go(cur + 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("play").onclick = toggle;
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowRight") go(cur + 1);
  else if (ev.key === "ArrowLeft") go(cur - 1);
  else if (ev.key === " ") { ev.preventDefault(); toggle(); }
});

const params = new URLSearchParams(location.search);
if (params.has("pausado")) toggle();
if (params.has("captura")) document.body.classList.add("captura");
(document.fonts?.ready || Promise.resolve()).then(() => go(Number(params.get("cena")) || 0));
</script>
</body>
