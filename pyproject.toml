[project]
name = "autoseguro"
version = "0.1.0"
description = "Agente de cotação de seguro de veículo via WhatsApp (MVP de demonstração)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sentence-transformers>=6.2.0",
    "langgraph>=1.2.20",
    "langchain-anthropic>=1.7.10",
    "langgraph-checkpoint-postgres>=3.2.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoseguro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
